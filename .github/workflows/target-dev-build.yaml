name: '[Entire] Build Developer Version'

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  discussions: write
  id-token: write

concurrency:
  group: dev-build
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  windows_amd64_build:
    name: Windows x86_64 Build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.repository, 'assassin321') }}
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: true
      bundle-type: 'both'
      arch: 'x86_64'
      tag: 'pre-release'
    secrets: inherit

  windows_aarch64_build:
    name: Windows aarch64 Build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.repository, 'assassin321') }}
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: true
      bundle-type: 'both'
      arch: 'aarch64'
      tag: 'pre-release'
    secrets: inherit

  update_tag:
    name: Update tag
    needs:
      [
        windows_amd64_build,
        windows_aarch64_build,
      ]
    uses: ./.github/workflows/deps-update-tag.yaml
    with:
      tag: 'pre-release'

  delete_current_releases:
    name: Delete Current Releases
    needs: [update_tag]
    uses: ./.github/workflows/deps-delete-releases.yaml
    with:
      tag: 'pre-release'

  upload_release_assets:
    name: Upload Release Assets
    needs: [delete_current_releases]
    uses: ./.github/workflows/deps-upload-release-assets.yaml
    with:
      tag: 'pre-release'

  updater:
    name: Create Updater
    needs: [upload_release_assets]
    uses: ./.github/workflows/deps-create-updater.yaml
    with:
      nightly: true
    secrets: inherit
