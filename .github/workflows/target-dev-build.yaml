name: '[Release] Build and Publish Nightly'

on:
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  check_changes:
    name: Check Nightly Changes
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.repository, 'assassin321') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check changes since previous nightly
        id: changes
        run: deno task check:nightly-changes

  windows_amd64_build:
    name: Windows x86_64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: true
      bundle-type: 'both'
      arch: 'x86_64'
      tag: 'pre-release'
    secrets: inherit

  windows_aarch64_build:
    name: Windows aarch64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: true
      bundle-type: 'both'
      arch: 'aarch64'
      tag: 'pre-release'
    secrets: inherit

  linux_amd64_build:
    name: Linux amd64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: true
      tag: 'pre-release'
      arch: 'x86_64'
    secrets: inherit

  linux_aarch64_build:
    name: Linux aarch64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: true
      tag: 'pre-release'
      arch: 'aarch64'
    secrets: inherit

  macos_amd64_build:
    name: macOS amd64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: true
      aarch64: false
      tag: 'pre-release'
    secrets: inherit

  macos_aarch64_build:
    name: macOS aarch64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: true
      aarch64: true
      tag: 'pre-release'
    secrets: inherit

  update_tag:
    name: Update tag
    needs:
      [
        windows_amd64_build,
        windows_aarch64_build,
        linux_amd64_build,
        linux_aarch64_build,
        macos_amd64_build,
        macos_aarch64_build,
      ]
    uses: ./.github/workflows/deps-update-tag.yaml
    with:
      tag: 'pre-release'

  delete_current_releases:
    name: Delete Current Releases
    needs: [update_tag]
    uses: ./.github/workflows/deps-delete-releases.yaml
    with:
      tag: 'pre-release'

  upload_release_assets:
    name: Upload Release Assets
    needs: [delete_current_releases]
    uses: ./.github/workflows/deps-upload-release-assets.yaml
    with:
      tag: 'pre-release'

  updater:
    name: Create Updater
    needs: [upload_release_assets]
    uses: ./.github/workflows/deps-create-updater.yaml
    with:
      nightly: true
    secrets: inherit