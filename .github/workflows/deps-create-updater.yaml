name: '[Reusable] Publish Updater Manifests'

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Tag being released (stable/beta)'
        required: false
        type: string
      release_body:
        description: 'Release Body'
        required: false
        type: string
  workflow_call:
    inputs:
      nightly:
        description: 'Nightly'
        required: true
        type: boolean
      release_tag:
        description: 'Tag being released'
        required: false
        type: string
      release_body:
        description: 'Release Body'
        required: false
        type: string

jobs:
  updater:
    name: Update Updater
    runs-on: ubuntu-latest
    concurrency:
      group: updater-manifests-${{ inputs.nightly }}-${{ inputs.release_tag || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Fetch all tags manually (workaround for actions/checkout#1467)
        if: ${{ inputs.release_tag != '' }}
        run: git fetch --tags origin
      
      - name: Guard resolved ref
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD      : $(git rev-parse HEAD)"
          echo "describe  : $(git describe --tags --always --dirty 2>&1)"
          echo "tag count : $(git tag | wc -l)"
          echo "nightly   : ${{ inputs.nightly }}"
          echo "tag       : ${{ inputs.release_tag }}"
          if [ "${{ inputs.nightly }}" != "true" ] && [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::release_tag 为空：stable/beta 必须由 release 事件触发或显式传入 release_tag"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test unified updater manifest
        run: deno task test:updater

      - name: Update Nightly Updater
        if: ${{ inputs.nightly == true }}
        run: deno task updater:nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Diagnose release visibility
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ inputs.release_tag }}"
          API="https://api.github.com/repos/${{ github.repository }}"
          HDR=(-H "Authorization: Bearer ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               -H "X-GitHub-Api-Version: 2022-11-28")

          echo "== tag 在不在远程 =="
          git ls-remote --tags origin "refs/tags/${TAG}" || true

          echo "== A. by-tag（只认 published）=="
          curl -sS -o /tmp/a.json -w 'HTTP %{http_code}\n' "${HDR[@]}" "${API}/releases/tags/${TAG}"

          echo "== B. list（含 draft，push 权限可见）=="
          curl -sS -o /tmp/b.json -w 'HTTP %{http_code}\n' "${HDR[@]}" "${API}/releases?per_page=100"
          jq -r '.[] | "\(.tag_name)\tdraft=\(.draft)\tprerelease=\(.prerelease)\tassets=\(.assets|length)"' /tmp/b.json 2>/dev/null | head -20

          echo "== C. 同 tag 的 draft 明细 =="
          jq --arg t "$TAG" '[.[] | select(.tag_name==$t)]' /tmp/b.json 2>/dev/null
      
      - name: Update Stable and Beta Updaters
        if: ${{ inputs.nightly == false }}
        run: deno task updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_BODY: ${{ inputs.release_body }}