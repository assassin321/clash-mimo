on:
  pull_request:
  pull_request_target:
    types: [closed]
  push:
    branches:
      - dev

name: '[CI] Build Application'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel Closed Pull Request CI
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo 'Pull request closed; previous CI cancelled by concurrency.'

  changes:
    name: Changes
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      scripts: ${{ steps.classify.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Classify changed paths
        id: classify
        run: deno task check:changed-parts "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  build:
    name: Build Tauri
    strategy:
      matrix:
        targets:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
      fail-fast: false
    runs-on: ${{ matrix.targets.os }}
    needs: [changes]
    env:
      FRONTEND: ${{ needs.changes.outputs.frontend }}
      BACKEND: ${{ needs.changes.outputs.backend }}
      RUN: ${{ needs.changes.outputs.backend == 'true' || (startsWith(matrix.targets.os, 'ubuntu-') && needs.changes.outputs.frontend == 'true') }}
    steps:
      - name: Set git to use LF
        if: env.RUN == 'true'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        if: env.RUN == 'true'
        with:
          submodules: recursive

      - name: Tauri dependencies
        if: startsWith(matrix.targets.os, 'ubuntu-') && env.BACKEND == 'true'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-3-dev
          libayatana-appindicator3-dev
          libwebkit2gtk-4.1-dev
          librsvg2-dev
          libxdo-dev
          webkitgtk-webdriver
          xvfb

      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(matrix.targets.os, 'macos-') && env.BACKEND == 'true'
        with:
          xcode-version: 'latest-stable'

      - name: Install Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Install Deno
        if: env.RUN == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        if: env.BACKEND == 'true'
        with:
          workspaces: 'backend'
          save-if: ${{ github.event_name == 'push' }}

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        if: env.RUN == 'true'
        with:
          run_install: false

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Prepare sidecar and resources
        if: env.BACKEND == 'true'
        run: pnpm prepare:check

      - name: Prepare frontend
        if: env.RUN == 'true'
        run: pnpm -r build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Build Backend
        if: env.BACKEND == 'true'
        run: cargo build --release --manifest-path backend/Cargo.toml